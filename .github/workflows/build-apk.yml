name: Crear APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar firma estable
        uses: actions/cache@v4
        with:
          path: app/stable-debug.keystore
          key: pedidos-navidad-firma-android-v1
      - name: Crear firma si es la primera compilación
        run: |
          if [ ! -f app/stable-debug.keystore ]; then
            keytool -genkeypair -v -keystore app/stable-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=La Polleria 2.0, OU=Aplicaciones, O=La Polleria 2.0, L=Madrid, C=ES"
          fi
      - name: Compilar APK
        run: gradle :app:assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pedidos-Navidad-La-Polleria-2.0
          path: app/build/outputs/apk/debug/app-debug.apk
